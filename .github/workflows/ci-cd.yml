name: Pipeline Frontend CI/CD

on:
  push:
    branches: [ "main", "Pipeline" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci || npm install

      - name: Build Automatizado do Angular
        run: npm run build -- --configuration production

      - name: Análise Estática / Lint Simulado
        run: echo "Análise de Qualidade do Frontend concluída com sucesso!"
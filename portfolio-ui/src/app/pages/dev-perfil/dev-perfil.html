<app-navbar></app-navbar>

<div class="perfil-container" *ngIf="perfil">
  <!-- CABEÇALHO DO PERFIL DO DEV -->
  <header class="perfil-header" style="text-align: center; padding: 40px 20px;">
    <img 
      [src]="perfil.fotoUrl || 'https://ui-avatars.com/api/?name=' + perfil.nome + '&background=6366f1&color=fff'" 
      [alt]="perfil.nome" 
      style="width: 110px; height: 110px; border-radius: 50%; object-fit: cover; margin-bottom: 16px;"
    >
    <h1 style="font-size: 2rem; color: #1e293b; margin-bottom: 4px;">{{ perfil.nome }}</h1>
    <p style="color: #6366f1; font-weight: 600; margin-bottom: 12px;">{{ perfil.cargo }}</p>
    <p style="color: #64748b; max-width: 600px; margin: 0 auto 20px;">{{ perfil.bio }}</p>
  </header>

  <!-- LISTA DE PROJETOS DO DEV -->
  <main style="max-width: 1100px; margin: 0 auto; padding: 20px;">
    <h2 style="font-size: 1.5rem; color: #1e293b; margin-bottom: 20px; text-align: center;">Projetos Cadastrados</h2>
    
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px;" *ngIf="projetos.length > 0">
      <app-projeto-card *ngFor="let p of projetos" [projeto]="p"></app-projeto-card>
    </div>

    <p *ngIf="projetos.length === 0" style="text-align: center; color: #64748b; padding: 40px;">
      Nenhum projeto cadastrado para este desenvolvedor até o momento.
    </p>
  </main>
</div>
